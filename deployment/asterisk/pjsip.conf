[global]
type=global
user_agent=AiZentrum-Pilot

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.26.16.0/20
external_signaling_address=13.38.206.137
external_media_address=13.38.206.137

[voipunify]
type=endpoint
transport=transport-udp
context=from-voipunify
disallow=all
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=voipunify
allow_subscribe=no
allow_transfer=no
rtp_timeout=45

[voipunify]
type=aor
contact=sip:voip.voipunify.com:5060
qualify_frequency=60

[voipunify-identify]
type=identify
endpoint=voipunify
match=194.38.128.79/32
